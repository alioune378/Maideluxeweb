[build]
  publish = "."
  command = "echo 'static site'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Private List: one-click unsubscribe link used in every email
[[redirects]]
  from = "/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/updates.json"
  [headers.values]
    Cache-Control = "no-cache"
